<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250"
     role="img" aria-label="Cosa ci sfugge? Theorem: there exists x that calms the shen, which implies focus, calm, sleep and balance. Proof: x = Neiguan (内关). Tão óbvio como 人中 bem embaixo do nosso nariz.">
  <defs>
    <!-- painel: o mesmo degradê do <main> do site -->
    <linearGradient id="painel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171334"/>
      <stop offset="1" stop-color="#0a091b"/>
    </linearGradient>
    <!-- mancha de luz lilás, como no fundo do site -->
    <radialGradient id="luz" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#5140a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5140a8" stop-opacity="0"/>
    </radialGradient>
    <!-- linha dourada que some nas pontas -->
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4c96b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f4c96b"/>
      <stop offset="1" stop-color="#f4c96b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- cartão -->
  <rect x="1" y="1" width="618" height="248" rx="22" fill="url(#painel)"/>
  <rect x="1" y="1" width="618" height="248" rx="22" fill="url(#luz)"/>
  <rect x="1" y="1" width="618" height="248" rx="22" fill="none"
        stroke="#ffffff" stroke-opacity=".17"/>

  <!-- sobretítulo dourado -->
  <text x="310" y="48" text-anchor="middle" fill="#f4c96b"
        font-family="Arial, sans-serif" font-size="12" font-weight="700"
        letter-spacing="3.5">COSA CI SFUGGE?</text>

  <rect x="265" y="64" width="90" height="2" fill="url(#linha)"/>

  <!-- enunciado, no estilo do amsthm: rótulo em negrito, texto em itálico -->
  <text x="310" y="112" text-anchor="middle" fill="#f7f5ff"
        font-family="Georgia, 'Times New Roman', serif" font-size="17">
    <tspan font-weight="700">Theorem.</tspan>
    <tspan font-style="italic">∃x that calms the 神 ⇒ focus ∧ calm ∧ sleep ∧ balance.</tspan>
  </text>

  <!-- prova: rótulo em itálico, texto normal -->
  <text x="310" y="150" text-anchor="middle" fill="#f7f5ff"
        font-family="Georgia, 'Times New Roman', serif" font-size="17">
    <tspan font-style="italic">Proof.</tspan>
    <tspan>x = 内关.</tspan>
  </text>

  <text x="310" y="192" text-anchor="middle" fill="#c9c5dc"
        font-family="Georgia, 'Times New Roman', serif" font-size="15">Tão óbvio como 人中 bem embaixo do nosso nariz.</text>

  <!-- fim da demonstração, alinhado à direita -->
  <text x="582" y="222" text-anchor="end" fill="#d8ccff"
        font-family="Georgia, serif" font-size="15">■</text>
</svg>
