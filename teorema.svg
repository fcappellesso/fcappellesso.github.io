<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="Cosa ci sfugge? Theorem: there exists x that calms the shen, which implies focus, calm, sleep and balance. Proof: x = Neiguan (内关). Tão óbvio como 人中 bem embaixo do nosso nariz.">
